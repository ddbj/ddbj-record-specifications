# GEA のメタデータ（MAGE-TAB の IDF / SDRF、アレイ設計の ADF、CIBEX）の項目を、v3 のどこに置くか。
# tests/unit/schema/test_v3_gea_mapping.py が、全ての行の場所がモデルに実在すること、
# gea_full.json / gea_array_design_full.json / gea_unread_sdrf.json に全ての行の実例があることを確かめる。
# モデルを変えたら、ここも手で直す。
#
# 対象は、D-way の GEA の DB (dordb の mass.metadata) にある IDF / SDRF / ADF の全ての版と、CIBEX の
# ファイル (dordb に無いので、公開用の写しの cibex/ から) に現れる項目。accession が振られていない登録 (151 件) は
# 作っている途中のものなので含めない (accession を振った登録の、振る前の版は含める)。公開用の写しは、
# 公開した experiment の、公開したときの版しか持たない。
#
#   idf     IDF の行の見出し
#   sdrf    SDRF の列。角括弧の中は [*] にまとめ、属性の列は直前のノードを @ の後に書く。
#           Comment[*] は、別の行にある名前 (Comment[BioSample] など) を除いたもの。
#           Protocol REF は、直後のノードを > の後に書く。
#           (unread) は、Source Name で始まるタブ区切りの表でない SDRF (CSV や、SDRF の代わりに保存された
#           IDF)。表として読まず、ファイルのまま指す
#   adf     ADF の見出しの行。(table) は見出しの後の表
#   cibex   CIBEX の「節 / キー」
#
# 見出しの読み方:
#   - `Comment [x]` のような [ の前の空白と、見出しの前後の空白は数えない (MAGE-TAB の見出しは空白を区別しない)
#   - SDRF の見出しの無い列は読まない。保存されたものには、どれも値が無い
#   - SDRF のデータファイルの列の後に来るのは、MAGE-TAB ではその Comment と、次のノードの Protocol REF と、
#     行の Factor Value だけ。過去の版には、そこに Characteristics、Parameter Value と Unit、Replicate を
#     書いたものがあり (後の版では Factor Value に直されるか、消されている)、その行の member の
#     misplaced_columns に見出しごと置く。直した後の形に読み替えると、直した履歴が消える
#
# 値の読み方は sra.yml と同じ:
#   (container)          値を持たない入れ物
#   a.b[]                b は list。[] の中の語は注記で、要素の type と、relation なら target.db
#   ... (注記)           読み手のための補足
#
# 数はその項目を含むファイルの数。IDF / SDRF / ADF は版を 1 つずつ数える。
#
# SDRF の行は record に持たない。行の上のノードをオブジェクトにし、ノードの続き方を次のように結ぶ。
#
#   Source           samples[]
#   Extract / Labeled Extract
#                    experiments[].pool.members[]。Assay に入る Labeled Extract (無ければ Extract) 1 つが member 1 つ。
#                    members[].sample が元の Source を指す。Factor Value と misplaced_columns は行の値なので、その行の
#                    member に置く
#   Assay            experiments[]
#   生データのファイル (Array Data File / Array Data Matrix File)
#                    runs[]。relations[part_of experiment] で、その行の Assay を指す
#   処理済みデータのファイル (Derived Array Data File / Derived Array Data Matrix File)
#                    analyses[]。relations[derived_from] で、左隣のファイル (無ければ Assay) と、その行の Assay を指す
#
# どのノードも、列の位置、名前、そのノードに置く値 (属性、Comment、Protocol REF、member なら元の sample と extract、
# Factor Value、misplaced_columns も) が全て同じものだけを 1 つのオブジェクトにまとめ、どれかが違えば同じ名前の別の
# オブジェクトにする。同じファイルの名前でも、Comment の md5 が行ごとに違うもの (表計算の連番で書き換わったもの) や、
# 別の列に書かれたものは別のオブジェクトになる。名前の重なるオブジェクトを指すときは、list の中の位置 (index) も
# 書く。
#
# run / analysis が、Assay の一部の member の行にしか無いときは、data_blocks[].member_name でその member を指す
# (dual-channel で channel ごとに別のファイルがあるものなど)。1 つの Assay の中で member を名前で指せないもの
# (member_name の重なるもの、Labeled Extract が無く Extract が複数あるもの) は書かない。
#
# 行は、relations や index をたどらずに、次の 2 つだけから作る。relations、members[].sample、
# data_blocks[].member_name はオブジェクトの間の関係を表すもので、行を作るのには使わない (index は、list の並びが
# 変わると別のものを指す)。
#
#   sdrf_rows    元の行の番号 (0 始まり。見出しの次の行が 0)。samples[]、members[]、runs[]、analyses[] に持つ
#   sdrf_column  run / analysis の、SDRF のファイルの列の中での位置 (0 始まり。左端のファイルの列が 0)
#
# 行 n は、n を持つ sample と member (と、member を含む experiment)、n を持つ run / analysis からなり、ファイルは
# sdrf_column の順に並ぶ。行は番号の順に作る。全く同じ行の繰り返し (22 版に計 363 行。公開中の E-GEAD-414、415、
# 416 の最新版にもある) も、番号が違うので別の行として戻る。番号で行を決めるので、オブジェクトの組み合わせから
# 元に無い行が増えることも無い。sdrf_rows は番号の集まりで、並びに意味は無い。
#
# record は次を満たす: 0 から行の数 - 1 までの番号が、それぞれちょうど 1 つの sample と 1 つの member にある。
# 1 つの番号を持つ run / analysis の sdrf_column は重ならない。
#
# 保たないのは、種類の違う列の並び (ノードの中で Comment が Technology Type の前か後か、misplaced_columns の列が
# Factor Value の前か後か、など)。同じ種類の列の並びは保つ。

