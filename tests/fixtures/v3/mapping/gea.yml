# GEA のメタデータ（MAGE-TAB の IDF / SDRF、アレイ設計の ADF、CIBEX）の項目を、v3 のどこに置くか。
# tests/unit/schema/test_v3_gea_mapping.py が、全ての行の場所がモデルに実在すること、
# gea_full.json / gea_array_design_full.json に全ての行の実例があることを確かめる。
# モデルを変えたら、ここも手で直す。
#
# 対象は GEA が公開している全てのファイルに現れる項目。
#
#   idf     IDF の行の見出し
#   sdrf    SDRF の列。角括弧の中は [*] にまとめ、属性の列は直前のノードを @ の後に書く。
#           Comment[*] は、別の行にある名前 (Comment[BioSample] など) を除いたもの。
#           Protocol REF は、直後のノードを > の後に書く
#   adf     ADF の見出しの行。(table) は見出しの後の表
#   cibex   CIBEX の「節 / キー」
#
# 値の読み方は sra.yml と同じ:
#   (container)          値を持たない入れ物
#   a.b[]                b は list。[] の中の語は注記で、要素の type と、relation なら target.db
#   ... (注記)           読み手のための補足
#
# 数はその項目を含むファイルの数。
#
# SDRF の行は record に持たない。行の上のノードをオブジェクトにし、ノードの続き方を次のように結ぶ。
#
#   Source           samples[]。名前と値が同じ Source は 1 つの sample にし、名前が同じで値が違えば別の sample にする
#   Extract / Labeled Extract
#                    experiments[].pool.members[]。Assay に入る Labeled Extract (無ければ Extract) 1 つが member 1 つ。
#                    members[].sample が元の Source を指す。Factor Value は行の値なので、その行の member に置く
#   Assay            experiments[]
#   生データのファイル (Array Data File / Array Data Matrix File)
#                    runs[]。同じ列の同じ名前は 1 つの run にする。relations[part_of experiment] で、その行の Assay を指す
#   処理済みデータのファイル (Derived Array Data File / Derived Array Data Matrix File)
#                    analyses[]。relations[derived_from] で、左隣のファイル (無ければ Assay) と、その行の Assay を指す
#
# run / analysis が、Assay の一部の member の行にしか無いときは、data_blocks[].member_name でその member を指す
# (dual-channel で channel ごとに別のファイルがあるものなど)。
#
# 行は、experiments[] の順に、その pool.members[] の順に、member から relations をたどって行き着くファイルの並びごとに
# 1 つ作る。元の行の順序と、全く同じ行の繰り返しは保たない。1 つの Assay の中で member_name が重なる SDRF
# (名前を使い回したもの) は、どのファイルがどの member のものかを指せないので、作り直すと行の組み合わせが増える。

