# ST.26 の配列表（WIPO の DTD V1_3 と、JPO が足す Bibliography）のヘッダーの項目を、v3 のどこに
# 置くか。tests/unit/schema/test_v3_st26_mapping.py が、全ての行の場所がモデルに実在すること、
# WIPO の DTD が宣言するヘッダーの要素と属性と raw fixture の ST.26 のファイルのヘッダーの項目が
# 全てここにあること、st26_full.json に全ての行の実例があることを確かめる。モデルを変えたら、
# ここも手で直す。
#
# ヘッダーは配列（SequenceData）より前の全てと、JPO が末尾に足す Bibliography。SequenceData の中
# （配列と feature）はこの表に含めない。
#
# 対象は JPO との受け渡しの場所（a012:ddbjjpo/from_JPO）にある配列表の全てのファイル（2026-09-26
# に集計、JPO から受け取った 20,731 件と MOIP の 723 件のうち、XML として読めた 21,452 件）に
# 現れる項目。
#
#   A/B          A の中の B
#   A/@name      A の属性
#
# 値の読み方:
#   (container)          値を持たない入れ物。子が値を持つ
#   a.b[]                b は list
#   ... (注記)           読み手のための補足
#
# 日付は ISO 8601 にする。Bibliography の日付は YYYYMMDD（20241203）と書かれているので書き直し、
# XML に戻すときは YYYYMMDD に戻す。決まった書かれ方でない日付（EarliestPriorityApplicationIdentification/
# FilingDate の 4/28/2023 が 1 件）は、書き直すには書かれ方を推し量ることになるので、書かれたまま持ち、
# 戻すときもそのまま書く。そのような日付は検証で止める（submission-bulk-st26 の PAT_R0008 /
# PAT_R0028、ddbj-validator のルール）。
# 空の要素と空の languageCode は、値が無いものとして持たない。ただし、中身が空で languageCode のある
# InventionTitle（1 件）は、発明の名称の数を保つために {"language_code": "ja"} として持つ。
#
# 数はその項目を含むファイルの数。

header:
  ST26SequenceListing/@dtdVersion:                                                     submission.st26.dtd_version  # 21,452 ファイル
  ST26SequenceListing/@fileName:                                                       submission.st26.file_name  # 21,442 ファイル
  ST26SequenceListing/@softwareName:                                                   submission.st26.software_name  # 21,446 ファイル
  ST26SequenceListing/@softwareVersion:                                                submission.st26.software_version  # 21,446 ファイル
  ST26SequenceListing/@productionDate:                                                 submission.st26.production_date  # 21,447 ファイル
  ST26SequenceListing/@originalFreeTextLanguageCode:                                   submission.st26.original_language  # 3,796 ファイル
  ST26SequenceListing/@nonEnglishFreeTextLanguageCode:                                 submission.st26.non_english_language  # 208 ファイル
  ST26SequenceListing/ApplicationIdentification:                                       (container)  # 20,919 ファイル
