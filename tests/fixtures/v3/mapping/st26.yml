# ST.26 の配列表（WIPO の DTD V1_3 と、JPO が足す Bibliography）のヘッダーの項目を、v3 のどこに
# 置くか。tests/unit/schema/test_v3_st26_mapping.py が、全ての行の場所がモデルに実在すること、
# WIPO の DTD が宣言するヘッダーの要素と属性と raw fixture の ST.26 のファイルのヘッダーの項目が
# 全てここにあること、st26_full.json に全ての行の実例があることを確かめる。モデルを変えたら、
# ここも手で直す。
#
# ヘッダーは配列（SequenceData）より前の全てと、JPO が末尾に足す Bibliography。SequenceData の中
# （配列と feature）はこの表に含めない。
#
# 対象は JPO との受け渡しの場所（a012:ddbjjpo/from_JPO）にある配列表の全てのファイル（2026-09-26
# に集計、JPO から受け取った 20,731 件と MOIP の 723 件のうち、XML として読めた 21,452 件）に
# 現れる項目。
#
#   @name        ルート要素（ST26SequenceListing）の属性
#   A/B          A の中の B
#   A@name       A の属性
#
# 値の読み方:
#   (container)          値を持たない入れ物。子が値を持つ
#   a.b[]                b は list
#   ... (注記)           読み手のための補足
#
# 日付は ISO 8601 にする。Bibliography の日付は YYYYMMDD（20241203）と書かれているので書き直す。
# 決まった書かれ方でない日付（EarliestPriorityApplicationIdentification/FilingDate の 4/28/2023
# が 1 件）は、書き直すには書かれ方を推し量ることになるので、書かれたまま持ち、検証で止める。
# 空の要素と空の languageCode は、値が無いものとして持たない。
#
# 数はその項目を含むファイルの数。

header:
  '@dtdVersion':                                                   submission.st26.dtd_version  # 21,452 ファイル
  '@fileName':                                                     submission.st26.file_name  # 21,442 ファイル
  '@softwareName':                                                 submission.st26.software_name  # 21,446 ファイル
  '@softwareVersion':                                              submission.st26.software_version  # 21,446 ファイル
  '@productionDate':                                               submission.st26.production_date  # 21,447 ファイル
  '@originalFreeTextLanguageCode':                                 submission.st26.original_language  # 3,796 ファイル
  '@nonEnglishFreeTextLanguageCode':                               submission.st26.non_english_language  # 208 ファイル
  ApplicationIdentification:                                       (container)  # 20,919 ファイル
  ApplicationIdentification/IPOfficeCode:                          submission.st26.application.ip_office_code  # 20,919 ファイル
  ApplicationIdentification/ApplicationNumberText:                 submission.st26.application.application_number_text  # 20,919 ファイル
  ApplicationIdentification/FilingDate:                            submission.st26.application.filing_date  # 20,919 ファイル
  ApplicantFileReference:                                          submission.st26.applicant_file_reference  # 20,873 ファイル
  EarliestPriorityApplicationIdentification:                       (container)  # 18,552 ファイル
  EarliestPriorityApplicationIdentification/IPOfficeCode:          submission.st26.earliest_priority.ip_office_code  # 18,552 ファイル
  EarliestPriorityApplicationIdentification/ApplicationNumberText: submission.st26.earliest_priority.application_number_text  # 18,552 ファイル
  EarliestPriorityApplicationIdentification/FilingDate:            submission.st26.earliest_priority.filing_date  # 18,552 ファイル
  ApplicantName:                                                   submission.st26.applicant_name  # 21,452 ファイル
  ApplicantName@languageCode:                                      submission.st26.applicant_name_language_code  # 21,452 ファイル
  ApplicantNameLatin:                                              submission.st26.applicant_name_latin  # 5,207 ファイル
  InventorName:                                                    submission.st26.inventor_name  # 3,259 ファイル
  InventorName@languageCode:                                       submission.st26.inventor_name_language_code  # 3,259 ファイル
  InventorNameLatin:                                               submission.st26.inventor_name_latin  # 942 ファイル
  InventionTitle:                                                  submission.st26.invention_titles[].title  # 21,452 ファイル
  InventionTitle@languageCode:                                     submission.st26.invention_titles[].language_code  # 21,452 ファイル
  SequenceTotalQuantity:                                           submission.st26.sequence_total_quantity  # 21,452 ファイル
  SequenceData:                                                    sequences.entries[] (中身はこの表の外)  # 21,452 ファイル
  Bibliography:                                                    (container)  # 20,729 ファイル
  Bibliography/PublishedDate:                                      submission.st26.published_date (YYYYMMDD を ISO 8601 に)  # 20,729 ファイル
  Bibliography/PriorityCountry:                                    submission.st26.priority.ip_office_code  # 18,075 ファイル
  Bibliography/PriorityNumber:                                     submission.st26.priority.application_number_text  # 18,075 ファイル
  Bibliography/PriorityDate:                                       submission.st26.priority.filing_date (YYYYMMDD を ISO 8601 に)  # 18,075 ファイル
