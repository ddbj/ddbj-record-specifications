services:
  app:
    build:
      context: .
      # The base image tag is rebuilt upstream, so every build pulls the latest one.
      pull: true
    image: ddbj-record-specifications
    container_name: ddbj-record-specifications
    # Files the container writes into the bind mount are owned by the host user.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    init: true
