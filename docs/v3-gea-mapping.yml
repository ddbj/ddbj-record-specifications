  Comment[Last Update Date]:          investigation.legacy.last_update_date  # 768 ファイル
  Comment[NBDC]:                      investigation.nbdc_approval  # 13 ファイル
  Comment[Number of channel]:         investigation.channel_type  # 369 ファイル
  Comment[Related study]:             relations[related_to].target.id (値の "DB:" は target.db に)  # 26 ファイル
  Comment[SecondaryAccession]:        investigation.identifiers[secondary].value  # 254 ファイル
  Experiment Description:             investigation.description  # 768 ファイル
  Experimental Design:                investigation.experimental_designs[]  # 768 ファイル
  Experimental Factor Name:           investigation.experimental_factors[].name  # 768 ファイル
  Experimental Factor Type:           investigation.experimental_factors[].type  # 768 ファイル
  Investigation Title:                investigation.title  # 768 ファイル
  MAGE-TAB Version:                   investigation.magetab_version  # 768 ファイル
  Person Affiliation:                 submission.submitters[].organizations[].name (その人の 1 つ目の organization)  # 768 ファイル
  Person First Name:                  submission.submitters[].first_name  # 768 ファイル
