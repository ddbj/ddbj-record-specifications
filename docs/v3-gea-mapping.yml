# GEA のメタデータ（MAGE-TAB の IDF / SDRF、アレイ設計の ADF、CIBEX）の項目を、v3 のどこに置くか。
# 考え方は docs/v3-gea.md、作り方は scripts/gea/README.md。このファイルは
# scripts/gea/build_mapping.py が書くので、手で直さない。
#
# 対象は a012:/usr/local/resources/gea（公開用の写し）にある全てのファイルに現れる項目。
#
#   idf     IDF の行の見出し
#   sdrf    SDRF の列。角括弧の中は [*] にまとめ、属性の列は直前のノードを @ の後に書く。
#           Protocol REF は、直後のノードを > の後に書く
#   adf     ADF の見出しの行。(table) は見出しの後の表
#   cibex   CIBEX の「節 / キー」
#
# 値の読み方は docs/v3-sra-mapping.yml と同じ:
#   (container)          値を持たない入れ物
#   a.b[]                b は list。[] の中の語は注記で、要素の type と、relation なら target.db
#   ... (注記)           読み手のための補足
#
# 数はその項目を含むファイルの数。

idf:
  Comment[AEExperimentType]:          investigation.experiment_type  # 768 ファイル
  Comment[Array Design REF]:          investigation.array_design_ref  # 367 ファイル
  Comment[BioProject]:                relations[part_of bioproject].target.id  # 768 ファイル
  Comment[CIBEX Accept Date]:         investigation.legacy.cibex_accept_date  # 254 ファイル
  Comment[CIBEX Public Release Date]: investigation.legacy.cibex_public_release_date  # 209 ファイル
  Comment[CIBEX Submitter]:           investigation.legacy.cibex_submitter  # 14 ファイル
