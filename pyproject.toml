[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddbj-record"
authors = [{ name = "Bioinformatics and DDBJ Center" }]
description = "The ddbj-record package provides tools for parsing, validating, and converting DDBJ record specifications."
readme = { file = "README.md", content-type = "text/markdown" }
version = "0.1.5"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic", "jsonref", "pyyaml"]

[project.urls]
Homepage = "https://github.com/ddbj/ddbj-record-specifications"
Documentation = "https://github.com/ddbj/ddbj-record-specifications/blob/main/README.md"
Repository = "https://github.com/ddbj/ddbj-record-specifications.git"

[project.optional-dependencies]
tests = ["hypothesis", "mypy", "pytest", "pytest-mock", "ruff", "types-PyYAML"]
scripts = ["beautifulsoup4", "pyyaml"]

[project.scripts]
dump_json_schema = "ddbj_record.schema.cli:main"
ddbj_record_validator = "ddbj_record.validator:main"
ddbj_record_converter = "ddbj_record.converter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ddbj_record"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
files = ["./ddbj_record/**/*.py"]
follow_imports = "normal"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["ddbj_record", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle (後回し)
    "ANN",     # flake8-annotations (mypy strict で代替)
    "COM812",  # trailing comma missing (ruff format と競合)
    "ISC001",  # implicit string concat (ruff format と競合)
    "E501",    # line length (line-length + ruff format で処理)
    "FIX",     # fixme (TODO/FIXME 検出は不要)
    "TD",      # flake8-todo (TODO/FIXME 検出は不要)
    "FBT",     # flake8-boolean-trap
    "EM",      # flake8-errmsg (例外メッセージの書式)
    "TRY003",  # long exception messages
    "RET504",  # unnecessary assignment before return
    "RET505",  # unnecessary else after return
    "C901",    # mccabe complexity
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "TC",      # flake8-type-checking (TYPE_CHECKING block 不使用の方針)
]

[tool.ruff.lint.per-file-ignores]
"ddbj_record/schema/cli.py" = ["T201", "BLE001"]
"ddbj_record/validator.py" = ["T201", "BLE001", "PLC0415"]
"ddbj_record/converter/cli.py" = ["T201", "BLE001"]
"ddbj_record/insdc/validator.py" = ["PLR0913"]
"tests/unit/converter/test_cli.py" = ["S603", "S607"]
"tests/**/*.py" = ["S101", "PLR2004"]
"scripts/**/*.py" = ["INP001", "T201", "BLE001", "PLR2004", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["ddbj_record"]
