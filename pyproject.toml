[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ddbj-record"
dynamic = ["version"]
description = "Pydantic models of the DDBJ Record JSON format, with converters between its major versions."
readme = "README.md"
authors = [{ name = "Bioinformatics and DDBJ Center" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10"]

[project.urls]
Homepage = "https://github.com/ddbj/ddbj-record-specifications"
Repository = "https://github.com/ddbj/ddbj-record-specifications.git"

[project.scripts]
dump_json_schema = "ddbj_record.schema.cli:main"
ddbj_record_converter = "ddbj_record.converter.cli:main"

[dependency-groups]
dev = ["hypothesis>=6.160", "mypy>=2", "pytest>=9", "pyyaml>=6", "ruff>=0.16", "types-PyYAML"]

# The version is the minor's tag (docs/versioning.md); a commit after it is v3.1.post2.dev0+g….
# An archive from GitHub carries the tag in .git_archival.txt, so a tarball install gets it too.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["ddbj_record"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers"]
xfail_strict = true

[tool.mypy]
files = ["ddbj_record"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.ruff]
line-length = 120
