name: Tag

# Tags the minor of the line's major once it has passed CI on its branch, and publishes its release
# note, which sorts the pull requests by whether they break the current users (docs/versioning.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # The lines only: "v[0-9]*" would also match a branch such as v3-release.
    branches: [main, "v[0-9]", "v[0-9][0-9]"]

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag the minor unless it is tagged already
        id: minor
        run: |
          tag=$(PYTHONPATH=. python3 -c 'from ddbj_record.schema import LATEST_MINOR_VERSIONS, SCHEMA_VERSIONS; print(LATEST_MINOR_VERSIONS[SCHEMA_VERSIONS[-1]])')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is tagged already"
          else
            git tag "$tag" "${{ github.event.workflow_run.head_sha }}"
            git push origin "refs/tags/$tag"
          fi
      # Also when the tag was made by an earlier run whose release failed.
      - name: Publish the release of the minor unless it is published already
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.minor.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is published already"
            exit 0
          fi
          major=${TAG%%.*}
          # The notes start at the previous minor of the same major: another line's tags are not its history.
          previous=$(git tag --list "$major.*" | grep -E "^$major\.[0-9]+$" | grep -vx "$TAG" | sort -t. -k2,2n | tail -n 1 || true)
          # Only the newest major's release is the repository's latest.
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | cut -d. -f1 | sort -V | tail -n 1 || true)
          latest=$([ "$newest" = "$major" ] && echo true || echo false)
          if [ -n "$previous" ]; then
            gh release create "$TAG" --verify-tag --latest="$latest" --generate-notes --notes-start-tag "$previous"
          else
            gh release create "$TAG" --verify-tag --latest="$latest" --notes "$major の minor を数え始めた最初の tag。これより前の変更は pull request の履歴を見る。"
          fi
