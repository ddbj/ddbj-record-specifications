name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra tests

      - run: uv run ruff check ddbj_record/ tests/
      - run: uv run ruff format --check ddbj_record/ tests/
      - run: uv run mypy
      - run: uv run pytest
