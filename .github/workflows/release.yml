name: release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build_and_deploy_wheel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Build Binary Wheel and Source Tarball
        run: uv build

      - name: Check Distribution Validity with Twine
        run: uvx twine check dist/*

      - name: Upload sdist as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/ddbj_record-${{ github.ref_name }}.tar.gz

      - name: Upload wheel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/ddbj_record-${{ github.ref_name }}-py3-none-any.whl

  deploy_ghcr:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddbj-record-specifications:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ddbj-record-specifications:latest

  create_release:
    needs: [build_and_deploy_wheel]
    runs-on: ubuntu-24.04
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel

      - name: Release
        run: gh release --repo ${{ github.repository }} create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes ddbj_record-${{ github.ref_name }}.tar.gz ddbj_record-${{ github.ref_name }}-py3-none-any.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
