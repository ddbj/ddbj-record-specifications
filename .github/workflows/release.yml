name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
      - run: uv python install
      - run: uv sync

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(uv run python -c "from importlib.metadata import version; print(version('ddbj-record'))")
          echo "Tag: ${GITHUB_REF_NAME}, Package: ${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::Version mismatch: tag=${GITHUB_REF_NAME}, package=${PKG_VERSION}"
            exit 1
          fi

      - run: uv build
      - run: uvx twine check dist/*

      - name: Generate JSON Schema
        run: |
          uv run dump_json_schema --version v1
          uv run dump_json_schema --version v2

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            schemas/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddbj-record-specifications:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ddbj-record-specifications:latest

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Rename schema files to avoid name collision
        run: |
          mv schemas/v1/ddbj_record.schema.json ddbj_record.v1.schema.json
          mv schemas/v2/ddbj_record.schema.json ddbj_record.v2.schema.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.whl \
            ddbj_record.v1.schema.json \
            ddbj_record.v2.schema.json
