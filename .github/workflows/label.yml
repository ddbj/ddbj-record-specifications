name: Label

# A pull request that changes the shape says whether it breaks the current users (docs/versioning.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit/schema/test_versioning.py -k says_whether_it_breaks
        env:
          # The checkout is the merge of the pull request into its base, whose first parent is that base.
          PR_BASE: HEAD^1
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
